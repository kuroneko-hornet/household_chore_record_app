<!doctype html>
<head>
    <title>Hello Azure - Python Quickstart</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='bootstrap/css/bootstrap.min.css') }}">
    <link rel="shortcut icon" href="{{ url_for('static', filename='favicon.ico') }}">
</head>
<html>
   <body>
     <main>
        <div class="px-4 py-3 my-2 text-center">
            <img class="d-block mx-auto mb-4" src="{{ url_for('static', filename='images/azure-icon.svg') }}" alt="Azure Logo" width="192" height="192"/>
            <!-- <img  src="/docs/5.1/assets/brand/bootstrap-logo.svg" alt="" width="72" height="57"> -->
            <h1 class="display-6 fw-bold text-primary">下丸子 record</h1>            
          </div>
        <form method="post" action="{{url_for('transit_to_select_user_page')}}">
            <div class="col-md-6 mx-auto text-center">
                <label for="name" class="form-label fw-bold fs-5">家事完了したらタップ！</label>

                <!-- <p class="lead mb-2">作業者を選択</p> -->
                <div class="d-grid gap-2 d-sm-flex justify-content-sm-center my-2">
                  <button type="submit" value="掃除" name="task" class="btn btn-primary btn-lg px-4 gap-3">掃除</button>
                  <button type="submit" value="洗濯" name="task"class="btn btn-primary btn-lg px-4 gap-3">洗濯</button>
                  <button type="submit" value="ごみまとめ" name="task"class="btn btn-primary btn-lg px-4 gap-3">ごみまとめ</button>
                  <button type="submit" value="ごみ出し" name="task"class="btn btn-primary btn-lg px-4 gap-3">ごみ出し</button>
                  <button type="submit" value="買い出し" name="task"class="btn btn-primary btn-lg px-4 gap-3">買い出し</button>
                  <button type="submit" value="荷物受け取り" name="task"class="btn btn-primary btn-lg px-4 gap-3">荷物受け取り</button>

                  <button type="submit" value="米" name="task"class="btn btn-primary btn-lg px-4 gap-3">米</button>
                  <button type="submit" value="補充" name="task"class="btn btn-primary btn-lg px-4 gap-3">補充</button>
                  <button type="submit" value="清算処理" name="task"class="btn btn-primary btn-lg px-4 gap-3">精算処理</button>
                  <button type="submit" value="製氷" name="task"class="btn btn-primary btn-lg px-4 gap-3">製氷</button>
                  <button type="submit" value="軽微な家事" name="task"class="btn btn-primary btn-lg px-4 gap-3">軽微な家事</button>
                  <button type="submit" value="料理" name="task"class="btn btn-primary btn-lg px-4 gap-3">料理</button>
                </div>            
            </div>
        </form>
     </main>      
   </body>
</html>
